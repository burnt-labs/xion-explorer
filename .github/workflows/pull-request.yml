name: Pull Request

on:
  pull_request:
    branches: [xion/main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

jobs:
  cloudflare:
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-pr.yml@185554bd035d31757e526b90416eef9ed5ed56e1 # v1.2.0
    secrets:
      cloudflare-account-id: ${{ secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
      cloudflare-api-token: ${{ secrets.BURNT_CLOUDFLARE_API_TOKEN }}
